# Render Blueprint: the Studymon API as a free web service. Contract: docs/api-backend.md §4.
services:
  - type: web
    name: studymon-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: EXTRACT_MODEL
        value: "@cf/google/gemma-4-26b-a4b-it"
      - key: GRADE_MODEL
        value: "@cf/google/gemma-4-26b-a4b-it"
      - key: DAILY_NEURONS
        value: "9000"
