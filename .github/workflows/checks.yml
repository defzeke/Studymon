# The docs/rules.md §6 gates on every push and pull request. Contract: docs/skills.md §Verify a change.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        run: |
          mkdir -p ~/godot && cd ~/godot
          zip=Godot_v${GODOT_VERSION}_linux.x86_64.zip
          if [ ! -f "$zip" ]; then
            base=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION
            curl -fsSLO "$base/$zip"
            curl -fsSL "$base/SHA512-SUMS.txt" | grep " $zip\$" | sha512sum -c -
          fi
          unzip -o -q "$zip"
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Headless gates
        run: bash tests/gates.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest tests -q

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tests/links.sh
